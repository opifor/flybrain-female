<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>the hall</title>
<style>
:root{--ground:#0b0c0e;--card:#181b20;--ink:#e9edf3;--dim:#818a97}
html,body{margin:0;background:var(--ground);color:var(--ink);font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif}
#room{width:1280px;margin:auto;padding:48px 56px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(3,368px);grid-auto-rows:336px;gap:32px}
.card{box-sizing:border-box;background:var(--card);border:3px solid #30343b;border-radius:12px;padding:14px;position:relative;overflow:hidden}


.grid{grid-template-columns:repeat(4,268px);grid-auto-rows:280px;gap:32px}
.card{align-self:center;justify-self:center;padding:22px;border-color:#aaaaaa}
.name{font-size:22px;line-height:1.4;overflow-wrap:anywhere}
body.tiproom .name{font-size:18px}
.detail{color:#9aa7b8;font-size:16px;margin-top:24px}
body.hall .grid{grid-template-columns:repeat(2,568px);grid-auto-rows:600px}
body.hall .card{width:100%;height:100%;border-color:#9aa7b8;padding:42px}
body.hall .name{font-size:42px;margin-top:120px}

</style>
</head>
<body>
<main id="room">
<div id="cards" class="grid"></div>
<section id="disclosure" style="margin-top:48px;color:#818a97;font-size:14px"></section>
</main>
<script id="room-declaration" type="application/json">{"name": "the hall", "path": "/hall", "cards": {"source": "registered rooms with healthy loopback executors", "refresh_seconds": 2}, "commit_means": "entering that room", "reward_source": "The hall delivers no sugar or shock; the entered room declares its own reward source.", "chosen": ["The doors are the rooms people built. Which one she walks into is her stop."], "measured": ["Two readings and a descending-neuron stop open a door."]}</script>
<script>
const roomData = JSON.parse(document.getElementById('room-declaration').textContent);
document.body.className = roomData.path.slice(1);
function drawCards(cards) {
  document.getElementById('cards').replaceChildren(...cards.map(card => {
    const node = document.createElement('div');
    node.className = 'card'; node.dataset.token = card.token;
    if (card.area_scale != null) {
      const scale = Math.sqrt(card.area_scale);
      node.style.width = (268 * scale) + 'px';
      node.style.height = (280 * scale) + 'px';
    }
    const name = document.createElement('div'); name.className = 'name';
    name.textContent = card.address ? card.address.slice(0, 4) + '...' + card.address.slice(-4) : card.name;
    if (card.address) node.title = card.address;
    const detail = document.createElement('div'); detail.className = 'detail';
    detail.textContent = card.holding_days != null ? card.holding_days + ' days held / fixture' : card.room.commit_means;
    node.append(name, detail); return node;
  }));
}
async function loadCards() {
  try {
    const response = await fetch(roomData.path + '/board.json', {cache:'no-store', signal:AbortSignal.timeout(4000)});
    if (!response.ok) throw Error('board unavailable');
    drawCards((await response.json()).cards || []);
  } catch (error) { drawCards([]); }
}
loadCards(); setInterval(loadCards, 2000);

const declaration = JSON.parse(document.getElementById("room-declaration").textContent);
const disclosure = document.getElementById("disclosure");
for (const sentence of [declaration.commit_means, declaration.reward_source, ...declaration.chosen, ...declaration.measured]) {
  const p = document.createElement("p"); p.textContent = sentence; disclosure.appendChild(p);
}
</script>
</body>
</html>
