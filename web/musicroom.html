<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>music room</title>
<style>
:root{--ground:#0b0c0e;--card:#181b20;--ink:#e9edf3;--dim:#818a97}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ground);color:var(--ink);font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif}
/* A room never scrolls: the cards are her whole world here, and the notes below the fold are for people. */
#room{width:1280px;margin:auto;padding:48px 56px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(3,368px);grid-auto-rows:336px;gap:32px}
.card{box-sizing:border-box;background:var(--card);border:3px solid #30343b;border-radius:12px;padding:14px;position:relative;overflow:hidden}
.door{position:fixed;top:760px;left:56px;right:56px;height:40px;box-sizing:border-box;background:var(--card);border:1px solid #30343b;border-radius:12px;padding:5px 14px;color:var(--dim);font-size:20px;z-index:1}
#status{position:fixed;top:700px;left:56px;right:56px;height:56px;box-sizing:border-box;background:var(--ground);font-size:20px;line-height:28px;overflow:hidden;z-index:1}
#status p{margin:0}
#status audio{display:none}
#disclosure{position:absolute;top:800px}


.grid{grid-template-columns:repeat(4,268px);grid-auto-rows:280px;gap:32px}
.card{align-self:center;justify-self:center;padding:22px;border-color:#aaaaaa}
.name{font-size:22px;line-height:1.4;overflow-wrap:anywhere}
body.tiproom .name{font-size:18px}
body.musicroom .grid{grid-template-columns:repeat(3,368px);grid-auto-rows:300px}
body.musicroom .card{width:100%;height:100%}
.detail{color:#9aa7b8;font-size:16px;margin-top:24px}
body.hall .grid{grid-template-columns:repeat(2,568px);grid-auto-rows:600px}
body.hall .card{width:100%;height:100%;border-color:#9aa7b8;padding:42px}
body.hall .name{font-size:42px;margin-top:120px}
body.hall #status{white-space:nowrap;text-overflow:ellipsis}

</style>
</head>
<body>
<main id="room">
<div id="cards" class="grid"></div>
<div id="status" role="status"></div>
<div id="door" class="door" data-token="/hall">the hall</div>
<section id="disclosure" style="margin-top:48px;color:#818a97;font-size:14px"></section>
</main>
<script id="room-declaration" type="application/json">{"name": "music room", "path": "/musicroom", "cards": {"source": "a small catalogue of Creative Commons music from Wikimedia Commons, each card names its license", "refresh_seconds": 60}, "commit_means": "she plays the track on the card she settled on", "reward_source": "Listeners supply sugar and shock through reactions kept in the room's paper record; the stream carries them later.", "chosen": ["People choose the catalogue search terms, the thirty-second minimum and the six-card board.", "a ten-minute room clock and a door in every room"], "measured": ["The room measures how long she stays, the drive from her mushroom body and her hearing cells' activity during music.", "nudges: how often the page had to push her out of an empty margin"], "how": ["her eye settles on a music card for at least two rounds before she can choose it.", "the title and artist become a smell; her mushroom body compares its drive with the other cards she has seen.", "when she stops, the room plays that track if her drive is above or below zero; either sign can play it.", "she stays with a track for at least thirty seconds and cannot restart it while it is playing.", "the sound file feeds her Johnston organs, the hearing cells in her antennae, while the page plays it.", "a listener's sugar or shock teaches the cells recorded when she chose that play.", "she may leave by the door at the bottom of the room; the house closes a room after ten minutes either way."]}</script>
<script>
const roomData = JSON.parse(document.getElementById('room-declaration').textContent);
document.body.className = roomData.path.slice(1);
let musicCards = [];
let currentPlaying = null;
function playingLine() {
  const line = document.querySelector('#status p');
  if (!line) return;
  const card = musicCards.find(card => card.token === String(currentPlaying?.track_id));
  line.textContent = currentPlaying ? 'now playing: ' +
    [currentPlaying.title, card?.artist, card?.license].filter(Boolean).join(' · ') : 'now playing: nothing';
}
function drawCards(cards) {
  if (roomData.path === '/musicroom') {
    musicCards = cards;
    playingLine();
  }
  if (roomData.path === '/hall') {
    document.getElementById('status').textContent = 'door order: ' + cards.map(card => card.name).join(' · ');
  }
  document.getElementById('cards').replaceChildren(...cards.map(card => {
    const node = document.createElement('div');
    node.className = 'card'; node.dataset.token = card.token;
    if (card.area_scale != null) {
      const scale = Math.sqrt(card.area_scale);
      node.style.width = (268 * scale) + 'px';
      node.style.height = (280 * scale) + 'px';
    }
    const name = document.createElement('div'); name.className = 'name';
    name.textContent = card.address ? card.address.slice(0, 4) + '...' + card.address.slice(-4) : card.name;
    if (card.address) node.title = card.address;
    const detail = document.createElement('div'); detail.className = 'detail';
    detail.textContent = roomData.path === '/musicroom' ?
      card.artist + ' / ' + card.license + ' / ' + Math.round(card.duration) + ' seconds' :
      card.holding_days != null ? card.holding_days + ' days held / fixture' : card.room.commit_means;
    node.append(name, detail); return node;
  }));
}
async function loadCards() {
  try {
    const response = await fetch(roomData.path + '/board.json', {cache:'no-store', signal:AbortSignal.timeout(4000)});
    if (!response.ok) throw Error('board unavailable');
    drawCards((await response.json()).cards || []);
  } catch (error) { drawCards([]); }
}
loadCards(); setInterval(loadCards, 2000);

if (roomData.path === '/musicroom') {
  const line = document.createElement('p'); line.textContent = 'now playing: nothing';
  const audio = document.createElement('audio'); audio.preload = 'none';
  document.getElementById('status').append(line, audio);
  let playKey = null;
  async function loadPlaying() {
    try {
      const response = await fetch('/musicroom/public.json', {cache:'no-store', signal:AbortSignal.timeout(4000)});
      if (!response.ok) return;
      const playing = (await response.json())?.now_playing;
      currentPlaying = playing;
      playingLine();
      const key = playing ? JSON.stringify([playing.track_id, playing.started_at]) : null;
      if (key === playKey) return;
      playKey = key;
      audio.pause();
      if (!playing) {
        audio.removeAttribute('src'); audio.load(); line.textContent = 'now playing: nothing'; return;
      }
      audio.onloadedmetadata = () => {
        if (playKey !== key) return;
        audio.currentTime = Math.max(0, Math.min(playing.duration, Date.now() / 1000 - playing.started_at));
        audio.play().catch(() => { /* Playback can resume when the room permits sound. */ });
      };
      audio.src = '/musicroom/track/' + encodeURIComponent(playing.track_id);
      audio.load();
    } catch (error) { /* The next reading brings the public clock back. */ }
  }
  loadPlaying(); setInterval(loadPlaying, 1000);
}

const declaration = JSON.parse(document.getElementById("room-declaration").textContent);
const disclosure = document.getElementById("disclosure");
for (const sentence of [declaration.commit_means, declaration.reward_source, ...declaration.chosen, ...declaration.measured]) {
  const p = document.createElement("p"); p.textContent = sentence; disclosure.appendChild(p);
}
if (declaration.how && declaration.how.length) {
  const title = document.createElement('h2'); title.textContent = 'How she plays here';
  const steps = document.createElement('ol');
  for (const sentence of declaration.how) {
    const step = document.createElement('li'); step.textContent = sentence; steps.appendChild(step);
  }
  disclosure.append(title, steps);
}
</script>
</body>
</html>
