<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>the betting room</title>
<style>
:root{--ground:#0b0c0e;--card:#181b20;--ink:#e9edf3;--dim:#818a97}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ground);color:var(--ink);font-family:ui-sans-serif,system-ui,"Segoe UI",sans-serif}
/* A room never scrolls: the cards are her whole world here, and the notes below the fold are for people. */
#room{width:1280px;margin:auto;padding:48px 56px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(3,368px);grid-auto-rows:336px;gap:32px}
.card{box-sizing:border-box;background:var(--card);border:3px solid #30343b;border-radius:12px;padding:14px;position:relative;overflow:hidden}
.door{position:fixed;top:760px;left:56px;right:56px;height:40px;box-sizing:border-box;background:var(--card);border:1px solid #30343b;border-radius:12px;padding:5px 14px;color:var(--dim);font-size:20px;z-index:1}

.question{font-size:24px;line-height:32px;height:168px;overflow:hidden;margin-left:30px}
.category{position:absolute;top:16px;left:14px;width:18px;height:50px;border-radius:4px}
.bar{height:16px;background:#2b3038;border-radius:8px;overflow:hidden;margin-top:14px}
.fill{height:100%;background:#9aa7b8}
.price{font-size:12px;color:var(--dim);margin-top:8px}
.empty{visibility:hidden}
.card.held{opacity:0.55}

</style>
</head>
<body>
<main id="room">
<div id="fast" class="grid"></div>
<div id="door" class="door" data-token="/hall">the hall</div>
<section id="disclosure" style="margin-top:48px;color:#818a97;font-size:14px"></section>
</main>
<script id="room-declaration" type="application/json">{"name": "the betting room", "path": "/betroom", "cards": {"source": "Polymarket current binary markets", "refresh_seconds": 30}, "commit_means": "a bet", "reward_source": "Resolved wins deliver sugar and losses shock; a sale teaches the sign of its paper profit.", "chosen": ["CHOSEN by people: a person chose current BTC and ETH 5-minute markets and BTC, ETH, SOL and XRP 15-minute markets because they resolve in minutes, so her learning signal arrives while she is still in the room; refreshed every 30 seconds. Up means YES and Down means NO on the fast shelf. A market's smell is a human mapping from its question words to DoOR odorants, scaled toward total 2.0. The fly cannot read the words. The picture is for the viewers. Category colours, price bars and time-to-close edge brightness are human encodings.", "a ten-minute room clock and a door in every room"], "measured": ["Stops and relative drive come from the female brain; this does not establish predictive skill.", "nudges: how often the page had to push her out of an empty margin"], "how": ["her eye settles on a card; a decision only starts once she has stayed on it for two rounds.", "the card's question is turned into a smell, word by word, and fed to her olfactory neurons.", "her mushroom body remembers whether that smell brought sugar or shock before.", "while she stays, the drive it produces is summed; positive means YES, negative means NO, zero means she walks away.", "the paper bookie takes the bet; when the market resolves, a win is sugar and a loss is shock, and she learns.", "she may leave by the door at the bottom of the room; the house closes a room after ten minutes either way."]}</script>
<script>
const slots = {fast: []};
for (const [shelf, count] of [['fast', 6]]) {
  for (let i = 0; i < count; i++) {
    const node = document.createElement('div');
    node.className = 'card empty';
    node.innerHTML = '<div class="category"></div><div class="question"></div><div class="bar"><div class="fill"></div></div><div class="price"></div>';
    document.getElementById(shelf).appendChild(node);
    slots[shelf].push(node);
  }
}
let board = [];
let bookState = {markets: {}, open_bets: []};
const colours = {crypto: '#b99bd9', politics: '#8aaacb', sports: '#9fbe93', other: '#c4b28e'};
function draw() {
  for (const shelf of ['fast']) {
    const items = board.filter(c => c.shelf === shelf);
    slots[shelf].forEach((node, index) => {
      const item = items.find(c => c.slot === index && c.end_at > Date.now() / 1000);
      node.className = item ? 'card' : 'card empty';
      node.dataset.token = item ? item.market_id : '';
      if (!item) return;
      const held = bookState.markets?.[item.market_id]?.open === true;
      node.classList.toggle('held', held);
      node.querySelector('.question').textContent = item.question;
      node.querySelector('.fill').style.width = (item.yes_price * 100) + '%';
      node.querySelector('.category').style.background = colours[item.category.toLowerCase()] || colours.other;
      const remaining = Math.max(0, item.end_at - Date.now() / 1000);
      const brightness = Math.round(55 + 170 * (1 - Math.min(1, remaining / (shelf === 'fast' ? 900 : 604800))));
      node.style.borderColor = `rgb(${brightness},${brightness},${brightness})`;
      node.querySelector('.price').textContent = `YES ${(item.yes_price * 100).toFixed(1)}% / ${Math.ceil(remaining / 60)} min to close / ${item.category}`;
    });
  }
}
async function loadBoard() {
  try {
    const response = await fetch('/betroom/board.json', {cache:'no-store'});
    if (!response.ok) throw Error('board unavailable');
    const data = await response.json();
    board = data.cards || [];
    draw();
  } catch (error) { }
}
async function loadBook() {
  try {
    const response = await fetch('/betroom/public.json', {cache:'no-store'});
    if (!response.ok) throw Error('paper book unavailable');
    const book = await response.json();
    if (!book) throw Error('paper book unavailable');
    bookState = book;
    draw();
  } catch (error) { }
}
loadBoard(); loadBook();
setInterval(loadBoard, 2000);
setInterval(loadBook, 2000);
setInterval(draw, 1000);

const declaration = JSON.parse(document.getElementById("room-declaration").textContent);
const disclosure = document.getElementById("disclosure");
for (const sentence of [declaration.commit_means, declaration.reward_source, ...declaration.chosen, ...declaration.measured]) {
  const p = document.createElement("p"); p.textContent = sentence; disclosure.appendChild(p);
}
if (declaration.how && declaration.how.length) {
  const title = document.createElement('h2'); title.textContent = 'How she plays here';
  const steps = document.createElement('ol');
  for (const sentence of declaration.how) {
    const step = document.createElement('li'); step.textContent = sentence; steps.appendChild(step);
  }
  disclosure.append(title, steps);
}
</script>
</body>
</html>
